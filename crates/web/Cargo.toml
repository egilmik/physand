[package]
name = "physand-web"
description = "wasm-bindgen glue exposing the Physand simulation to the browser."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
physand-sim = { path = "../sim" }
# Must match the installed wasm-bindgen CLI version exactly (see scripts/build-wasm.sh).
wasm-bindgen = "=0.2.100"
